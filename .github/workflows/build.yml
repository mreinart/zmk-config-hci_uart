name: Build nice!nano BLE Controller Image

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable  # Uses ZMK's toolchain container which natively contains the nice!nano board files
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize Zephyr Workspace
        run: |
          west init -m https://github.com/zephyrproject-rtos/zephyr --mr v3.5.0 workspace
          cd workspace
          west update

      - name: Create Custom Overlay Config
        run: |
          cat << 'EOF' > workspace/zephyr/samples/bluetooth/hci_uart/prj.conf
          CONFIG_BT=y
          CONFIG_BT_HCI_RAW=y
          CONFIG_BT_CTLR=y
          CONFIG_USB_DEVICE_STACK=y
          CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
          CONFIG_USB_CDC_ACM=y
          CONFIG_SERIAL=y
          CONFIG_UART_LINE_CTRL=y
          CONFIG_SHELL=n
          CONFIG_UART_CONSOLE=n
          CONFIG_BT_HCI_RAW_ON_RECV_META=y
          EOF

      - name: Build Firmware for nice!nano
        run: |
          cd workspace/zephyr
          west build -b nice_nano_v2 samples/bluetooth/hci_uart

      - name: Archive Production Artifacts
        uses: actions/artifacts@v4
        with:
          name: nicenano-ble-hci-image
          path: workspace/zephyr/build/zephyr/zephyr.uf2
